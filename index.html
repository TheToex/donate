<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate to TheToex</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Glowing Blurred Background Effect */
        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.5;
        }

        .glow-blob {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            border-radius: 50%;
            animation: moveBlob 12s infinite alternate ease-in-out;
        }

        .glow-blob:nth-child(2) {
            background: linear-gradient(135deg, #0284c7, #0d9488);
            width: 400px;
            height: 400px;
            right: -100px;
            bottom: -100px;
            animation-duration: 16s;
            animation-direction: alternate-reverse;
        }

        @keyframes moveBlob {
            0% {
                transform: translate(-50px, -50px) scale(1);
            }
            50% {
                transform: translate(150px, 200px) scale(1.1);
            }
            100% {
                transform: translate(50px, 100px) scale(0.9);
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            z-index: 1;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        @media (min-width: 480px) {
            .card {
                padding: 40px 30px;
            }
        }

        /* Profile Avatar Style */
        .avatar-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
            background-color: #1f2937;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .crypto-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .crypto-item {
            background-color: rgba(3, 7, 18, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .crypto-item:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .crypto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .crypto-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .crypto-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .crypto-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .crypto-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .crypto-network {
            font-size: 0.75rem;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        .address-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (min-width: 400px) {
            .address-row {
                flex-direction: row;
                align-items: center;
            }
        }

        .crypto-address {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.78rem;
            color: var(--text-secondary);
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
            width: 100%;
        }

        @media (min-width: 400px) {
            .copy-btn {
                width: auto;
            }
        }

        .copy-btn:hover {
            background-color: var(--accent-hover);
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .copy-btn.copied {
            background-color: var(--success-color);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <!-- Animated Glowing Background Elements -->
    <div class="background-glow">
        <div class="glow-blob"></div>
        <div class="glow-blob"></div>
    </div>

    <div class="container">
        <div class="card">
            <!-- Profile Avatar (Put your image file 'avatar.jpg' next to index.html) -->
            <div class="avatar-container">
                <img src="avatar.jpg" alt="TheToex Avatar">
            </div>
            
            <h1>Support TheToex</h1>
            <p>If you like my open-source work or projects, consider fueling my caffeine intake with a crypto donation!</p>

            <div class="crypto-list">

                <!-- 
                  ==================================================

                  ==================================================

                  with your actual Bitcoin wallet address.
                -->
                <div class="crypto-item">
                    <div class="crypto-header">
                        <div class="crypto-info-left">
                            <div class="crypto-icon">

                                    <path fill="#fff" d="M23.318 13.565c.342-2.28-1.39-3.504-3.757-4.323l.768-3.082-1.872-.467-.747 2.994c-.492-.123-1-.237-1.505-.35l.75-3.003-1.872-.467-.768 3.082c-.408-.093-.807-.184-1.196-.275l.002-.012-2.583-.645-.498 1.998s1.39.318 1.36.338c.758.189.894.69.871 1.087l-.872 3.498c.052.013.119.032.193.061l-.196-.049-1.223 4.908c-.093.231-.329.578-.859.444.03.044-1.36-.338-1.36-.338l-.931 2.146 2.436.607c.453.113.897.23 1.336.342l-.77 3.09 1.872.467.768-3.082c.507.137 1.002.268 1.491.392l-.766 3.076 1.872.467.77-3.09c3.159.598 5.534.357 6.53-2.476.804-2.28-.04-3.595-1.688-4.457 1.202-.277 2.106-1.069 2.348-2.705zm-4.208 5.908c-.57 2.29-4.425 1.053-5.676.741l1.015-4.072c1.251.312 5.253.93 4.661 3.331zm.573-5.968c-.521 2.091-3.729 1.03-4.777.772l.92-3.69c1.048.258 4.394.747 3.857 2.918z"/>
                                </svg>
                            </div>
                            <span class="crypto-name">Bitcoin</span>
                        </div>
                        <span class="crypto-network">BTC</span>
                    </div>
                    <div class="address-row">
                        <div class="crypto-address" id="btc-addr">bc1q8n2mhwuuwmlrpn8qfdt7wm0vyd58d4qhe2uxha</div>
                        <button class="copy-btn" onclick="copyToClipboard('btc-addr', this)">Copy</button>
                    </div>
                </div>

                <!-- 
                  ==================================================
                  USDT (TRC20) WALLET SECTION
                  ==================================================
                  Replace the value inside the crypto-address div 
                  with your actual USDT TRC20 wallet address.
                -->
                <div class="crypto-item">
                    <div class="crypto-header">
                        <div class="crypto-info-left">
                            <div class="crypto-icon">
                                <!-- Tether Official Circular SVG Icon -->
                                <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                                    <path fill="#26a17b" d="M16 32C7.163 32 0 24.837 0 16S7.163 0 16 0s16 7.163 16 16-7.163 16-16 16z"/>
                                    <path fill="#fff" d="M17.922 18.34v-3.033h4.721v-3.32h-4.721V8.675h-3.844v3.312H9.358v3.32h4.72v3.025c-3.957.19-7.078 1.144-7.078 2.29 0 1.156 3.156 2.119 7.158 2.302v4.364h3.844v-4.356c4.002-.191 7.158-1.154 7.158-2.31 0-1.137-3.08-2.083-6.966-2.28zm-1.922 3.655c-3.048 0-5.696-.692-6.521-1.594.825-.902 3.473-1.594 6.521-1.594 3.049 0 5.696.692 6.521 1.594-.825.902-3.472 1.594-6.521 1.594z"/>
                                </svg>
                            </div>
                            <span class="crypto-name">Tether (USDT)</span>
                        </div>
                        <span class="crypto-network">TRC20</span>
                    </div>
                    <div class="address-row">
                        <div class="crypto-address" id="usdt-addr">TCB8iRqhB4BXJhYETnVTYyWBWH6xwvhTKr</div>
                        <button class="copy-btn" onclick="copyToClipboard('usdt-addr', this)">Copy</button>
                    </div>
                </div>

            </div>

            <div class="footer">
                Thank you for your support! 🚀
            </div>
        </div>
    </div>

    <script>
        // JavaScript function to handle smooth and responsive copying to clipboard
        function copyToClipboard(elementId, button) {
            const textToCopy = document.getElementById(elementId).innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = button.innerText;
                button.innerText = 'Copied!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>

</body>
</html>
